default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: "<%= ENV.fetch("DATABASE_HOST", "localhost") %>"
  username: "<%= ENV.fetch("DATABASE_USERNAME", "postgres") %>"
  password: "<%= ENV.fetch("DATABASE_PASSWORD", "") %>"
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: "<%= ENV.fetch("DATABASE_NAME", "ruby_training_rails") %>"

test:
  <<: *default
  database: "<%= ENV.fetch("DATABASE_NAME", "ruby_training_rails") %>_test"

production:
  primary:
    <<: *default
    database: "<%= ENV.fetch("DATABASE_NAME") %>"

  cache:
    <<: *default
    database: "<%= ENV.fetch("DATABASE_NAME") %>_cache"
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: "<%= ENV.fetch("DATABASE_NAME") %>_queue"
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: "<%= ENV.fetch("DATABASE_NAME") %>_cable"
    migrations_paths: db/cable_migrate